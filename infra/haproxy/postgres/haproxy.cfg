global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend postgres_front
    bind *:5432
    default_backend postgres_back

backend postgres_back
    option tcp-check
    server postgres_primary postgres:5432 check resolvers docker resolve-prefer ipv4 init-addr libc,none
