global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m

listen stats
  bind *:7000
  mode http
  stats enable
  stats uri /
  stats refresh 10s

frontend postgres_writer
  bind *:5432
  default_backend patroni_primary

backend patroni_primary
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
  server patroni-postgres-1 patroni-postgres-1:5432 check port 8008
  server patroni-postgres-2 patroni-postgres-2:5432 check port 8008
  server patroni-postgres-3 patroni-postgres-3:5432 check port 8008

frontend postgres_reader
  bind *:5433
  default_backend patroni_replicas

backend patroni_replicas
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
  server patroni-postgres-1 patroni-postgres-1:5432 check port 8008
  server patroni-postgres-2 patroni-postgres-2:5432 check port 8008
  server patroni-postgres-3 patroni-postgres-3:5432 check port 8008
