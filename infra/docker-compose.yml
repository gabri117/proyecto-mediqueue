networks:
  mediqueue-net:
    driver: bridge

volumes:
  patient-db-data:
  schedule-db-data:
  appointment-db-data:
  payment-db-data:
  notification-db-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────────
  # BASES DE DATOS  (una por microservicio)
  # ─────────────────────────────────────────────

  patient-db:
    image: postgres:16-alpine
    container_name: patient-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: ${DB_USER:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue123}
    ports:
      - "5432:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediqueue} -d patient_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  schedule-db:
    image: postgres:16-alpine
    container_name: schedule-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: ${DB_USER:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue123}
    ports:
      - "5437:5432"
    volumes:
      - schedule-db-data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediqueue} -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  appointment-db:
    image: postgres:16-alpine
    container_name: appointment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: ${DB_USER:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue123}
    ports:
      - "5434:5432"
    volumes:
      - appointment-db-data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediqueue} -d appointment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USER:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue123}
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediqueue} -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USER:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue123}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediqueue} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # REDIS  (caché compartida + rate limiting)
  # ─────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # RABBITMQ  (mensajería de saga)
  # ─────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # MICROSERVICIOS
  # ─────────────────────────────────────────────

  patient-service:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-patient-service:${IMAGE_TAG:-latest}
    container_name: patient-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patient_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      patient-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  schedule-service:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-schedule-service:${IMAGE_TAG:-latest}
    container_name: schedule-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://schedule-db:5432/schedule_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      schedule-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  appointment-service-1:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-appointment-service:${IMAGE_TAG:-latest}
    container_name: appointment-service-1
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-db:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      appointment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  appointment-service-2:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-appointment-service:${IMAGE_TAG:-latest}
    container_name: appointment-service-2
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-db:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8093:8083"
    depends_on:
      appointment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service-1:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-payment-service:${IMAGE_TAG:-latest}
    container_name: payment-service-1
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service-2:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-payment-service:${IMAGE_TAG:-latest}
    container_name: payment-service-2
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8094:8084"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-notification-service:${IMAGE_TAG:-latest}
    container_name: notification-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway-1:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway-1
    restart: unless-stopped
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SERVER_PORT: 8080
      PATIENT_SERVICE_URL: http://patient-service:8081
      SCHEDULE_SERVICE_URL: http://schedule-service:8082
      APPOINTMENT_SERVICE_URL: http://appointment-service-1:8083,http://appointment-service-2:8083
      PAYMENT_SERVICE_URL: http://payment-service-1:8084,http://payment-service-2:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      patient-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  api-gateway-2:
    image: ghcr.io/${GITHUB_ORG:-mediqueue}/mediqueue-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway-2
    restart: unless-stopped
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      SERVER_PORT: 8080
      PATIENT_SERVICE_URL: http://patient-service:8081
      SCHEDULE_SERVICE_URL: http://schedule-service:8082
      APPOINTMENT_SERVICE_URL: http://appointment-service-1:8083,http://appointment-service-2:8083
      PAYMENT_SERVICE_URL: http://payment-service-1:8084,http://payment-service-2:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8080"
    depends_on:
      patient-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────
  # OBSERVABILIDAD
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mediqueue-dashboard.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
