global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway-1:8080
          - api-gateway-2:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - patient-service:8081
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: schedule-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - schedule-service:8082
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - appointment-service-1:8083
          - appointment-service-2:8083
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-service-1:8084
          - payment-service-2:8084
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8085
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
    metrics_path: /metrics
