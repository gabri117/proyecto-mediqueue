global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: api-gateway-lb
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway-lb:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - api-gateway
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: patient-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - patient-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: schedule-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - schedule-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: appointment-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - appointment-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: payment-lb
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-lb:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - payment-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - notification-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692
    metrics_path: /metrics

  - job_name: patroni-rest
    metrics_path: /metrics
    static_configs:
      - targets:
          - patroni-postgres-1:8008
          - patroni-postgres-2:8008
          - patroni-postgres-3:8008
        labels:
          cluster: mediqueue-postgres-ha

  - job_name: patroni-postgres-exporter
    static_configs:
      - targets:
          - patroni-postgres-exporter-1:9187
          - patroni-postgres-exporter-2:9187
          - patroni-postgres-exporter-3:9187
        labels:
          cluster: mediqueue-postgres-ha

  - job_name: patroni-haproxy
    metrics_path: /metrics
    static_configs:
      - targets:
          - patroni-postgres-lb:7000
        labels:
          cluster: mediqueue-postgres-ha

  - job_name: patroni-etcd
    metrics_path: /metrics
    static_configs:
      - targets:
          - etcd-1:2379
          - etcd-2:2379
          - etcd-3:2379
        labels:
          cluster: mediqueue-postgres-ha
