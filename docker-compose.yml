networks:
  mediqueue-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  redis-insight-data:
  prometheus-data:
  grafana-data:

services:

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: mediqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mediqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediqueue}
      POSTGRES_DB: ${DB_NAME:-mediqueue}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/backups/wal-archive:/var/lib/postgresql/wal-archive
      - ./infra/backups/local:/backups
      - ./infra/docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mediqueue} -d ${DB_NAME:-mediqueue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-lb:
    image: haproxy:alpine
    container_name: mediqueue-postgres-lb
    restart: unless-stopped
    ports:
      - "127.0.0.1:55461:5432"
    volumes:
      - ./infra/haproxy/postgres/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediqueue-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mediqueue-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_started
    networks:
      - mediqueue-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: mediqueue-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - mediqueue-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mediqueue-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mediqueue-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mediqueue-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mediqueue-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mediqueue-net
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/api-gateway.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      PATIENT_SERVICE_URL: http://patient-lb:8080
      SCHEDULE_SERVICE_URL: http://schedule-lb:8080
      APPOINTMENT_SERVICE_URL: http://appointment-lb:8080
      PAYMENT_SERVICE_URL: http://payment-lb:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      RATE_LIMIT_SCHEDULE_REPLENISH: 500
      RATE_LIMIT_SCHEDULE_BURST: 1000
      RATE_LIMIT_PATIENT_REPLENISH: 200
      RATE_LIMIT_PATIENT_BURST: 400
      RATE_LIMIT_APPOINTMENT_REPLENISH: ${RATE_LIMIT_APPOINTMENT_REPLENISH:-2000}
      RATE_LIMIT_APPOINTMENT_BURST: ${RATE_LIMIT_APPOINTMENT_BURST:-4000}
      GATEWAY_CB_SLIDING_WINDOW_SIZE: ${GATEWAY_CB_SLIDING_WINDOW_SIZE:-5000}
      GATEWAY_CB_MINIMUM_CALLS: ${GATEWAY_CB_MINIMUM_CALLS:-1000}
      GATEWAY_CB_FAILURE_RATE_THRESHOLD: ${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-95}
      GATEWAY_CB_WAIT_OPEN_SECONDS: 5
      GATEWAY_CB_HALF_OPEN_CALLS: ${GATEWAY_CB_HALF_OPEN_CALLS:-25}
      GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS:-3000}
      GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:-30s}
      GATEWAY_TIMELIMITER_TIMEOUT_SECONDS: ${GATEWAY_TIMELIMITER_TIMEOUT_SECONDS:-30}
      GATEWAY_BULKHEAD_DEFAULT_MAX_CONCURRENT_CALLS: ${GATEWAY_BULKHEAD_DEFAULT_MAX_CONCURRENT_CALLS:-1000}
      GATEWAY_BULKHEAD_APPOINTMENT_MAX_CONCURRENT_CALLS: ${GATEWAY_BULKHEAD_APPOINTMENT_MAX_CONCURRENT_CALLS:-3000}
      GATEWAY_BULKHEAD_MAX_WAIT_MILLIS: ${GATEWAY_BULKHEAD_MAX_WAIT_MILLIS:-0}
      RATE_LIMIT_PAYMENT_REPLENISH: 100
      RATE_LIMIT_PAYMENT_BURST: 200
      RATE_LIMIT_NOTIFICATION_REPLENISH: 200
      RATE_LIMIT_NOTIFICATION_BURST: 400
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      patient-lb:
        condition: service_healthy
      schedule-lb:
        condition: service_healthy
      appointment-lb:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      payment-lb:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  api-gateway-lb:
    image: haproxy:alpine
    container_name: mediqueue-api-gateway-lb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infra/haproxy/api-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  appointment-lb:
    image: haproxy:alpine
    container_name: mediqueue-appointment-lb
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./infra/haproxy/appointment/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      appointment-service:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  appointment-service:
    build:
      context: .
      dockerfile: infra/docker/appointment-service.Dockerfile
    restart: always
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=appointment,public
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=appointment,public
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-mediqueue}
      DB_USER: ${DB_USERNAME:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue}
      DB_PASSWORD: ${DB_PASSWORD:-mediqueue}
      HIKARI_MAX_POOL_SIZE: ${APPOINTMENT_HIKARI_MAX_POOL_SIZE:-8}
      HIKARI_MIN_IDLE: ${APPOINTMENT_HIKARI_MIN_IDLE:-2}
      HIKARI_CONNECTION_TIMEOUT_MS: 10000
      HIKARI_VALIDATION_TIMEOUT_MS: 3000
      HIKARI_MAX_LIFETIME_MS: 180000
      HIKARI_KEEPALIVE_TIME_MS: 30000
      HIKARI_IDLE_TIMEOUT_MS: 60000
      SPRING_FLYWAY_SCHEMAS: appointment
      SPRING_FLYWAY_DEFAULT_SCHEMA: appointment
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: appointment
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_PREFETCH: ${APPOINTMENT_RABBITMQ_PREFETCH:-50}
      RABBITMQ_LISTENER_CONCURRENCY: ${APPOINTMENT_RABBITMQ_LISTENER_CONCURRENCY:-4}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${APPOINTMENT_RABBITMQ_LISTENER_MAX_CONCURRENCY:-16}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PATIENT_SERVICE_URL: http://patient-lb:8080
      SCHEDULE_SERVICE_URL: http://schedule-lb:8080
      APPOINTMENT_HOLD_TTL_MINUTES: ${APPOINTMENT_HOLD_TTL_MINUTES:-30}
      LOADTEST_HOLD_EXPIRATION_ENABLED: ${LOADTEST_HOLD_EXPIRATION_ENABLED:-true}
      LOADTEST_OUTBOX_PUBLISHER_ENABLED: ${LOADTEST_OUTBOX_PUBLISHER_ENABLED:-true}
      LOADTEST_DIRECT_DB_VALIDATION_ENABLED: ${LOADTEST_DIRECT_DB_VALIDATION_ENABLED:-true}
      OUTBOX_PUBLISH_INTERVAL_MS: ${APPOINTMENT_OUTBOX_PUBLISH_INTERVAL_MS:-200}
      OUTBOX_BATCH_SIZE: ${APPOINTMENT_OUTBOX_BATCH_SIZE:-500}
      TOMCAT_MAX_THREADS: ${APPOINTMENT_TOMCAT_MAX_THREADS:-180}
      TOMCAT_MIN_SPARE_THREADS: ${APPOINTMENT_TOMCAT_MIN_SPARE_THREADS:-20}
      TOMCAT_ACCEPT_COUNT: ${APPOINTMENT_TOMCAT_ACCEPT_COUNT:-2000}
      TOMCAT_MAX_CONNECTIONS: ${APPOINTMENT_TOMCAT_MAX_CONNECTIONS:-8192}
      APPOINTMENT_CLIENT_CONNECT_TIMEOUT_MS: ${APPOINTMENT_CLIENT_CONNECT_TIMEOUT_MS:-1000}
      APPOINTMENT_CLIENT_READ_TIMEOUT_MS: ${APPOINTMENT_CLIENT_READ_TIMEOUT_MS:-3000}
      APPOINTMENT_CLIENT_CB_SLIDING_WINDOW_SIZE: ${APPOINTMENT_CLIENT_CB_SLIDING_WINDOW_SIZE:-100}
      APPOINTMENT_CLIENT_CB_MINIMUM_CALLS: ${APPOINTMENT_CLIENT_CB_MINIMUM_CALLS:-50}
      APPOINTMENT_CLIENT_CB_FAILURE_RATE_THRESHOLD: ${APPOINTMENT_CLIENT_CB_FAILURE_RATE_THRESHOLD:-80}
      APPOINTMENT_CLIENT_CB_WAIT_OPEN: ${APPOINTMENT_CLIENT_CB_WAIT_OPEN:-5s}
      APPOINTMENT_CLIENT_CB_HALF_OPEN_CALLS: ${APPOINTMENT_CLIENT_CB_HALF_OPEN_CALLS:-10}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-lb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/notification-service.Dockerfile
    restart: always
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=notification,public
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue}
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=notification,public
      DB_USER: ${DB_USERNAME:-mediqueue}
      DB_PASSWORD: ${DB_PASSWORD:-mediqueue}
      SPRING_FLYWAY_SCHEMAS: notification
      SPRING_FLYWAY_DEFAULT_SCHEMA: notification
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: notification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mediqueue}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_PREFETCH: ${NOTIFICATION_RABBITMQ_PREFETCH:-50}
      RABBITMQ_LISTENER_CONCURRENCY: ${NOTIFICATION_RABBITMQ_LISTENER_CONCURRENCY:-4}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${NOTIFICATION_RABBITMQ_LISTENER_MAX_CONCURRENCY:-12}
      HIKARI_MAX_POOL_SIZE: ${NOTIFICATION_HIKARI_MAX_POOL_SIZE:-6}
      HIKARI_MIN_IDLE: ${NOTIFICATION_HIKARI_MIN_IDLE:-2}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-lb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: .
      dockerfile: infra/docker/payment-service.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=payment,public
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=payment,public
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-mediqueue}
      DB_USER: ${DB_USERNAME:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue}
      DB_PASSWORD: ${DB_PASSWORD:-mediqueue}
      SPRING_FLYWAY_SCHEMAS: payment
      SPRING_FLYWAY_DEFAULT_SCHEMA: payment
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: payment
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_PREFETCH: ${PAYMENT_RABBITMQ_PREFETCH:-50}
      RABBITMQ_LISTENER_CONCURRENCY: ${PAYMENT_RABBITMQ_LISTENER_CONCURRENCY:-8}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${PAYMENT_RABBITMQ_LISTENER_MAX_CONCURRENCY:-16}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-10}
      PAYMENT_SIM_MIN_DELAY_MS: ${PAYMENT_SIM_MIN_DELAY_MS:-50}
      PAYMENT_SIM_MAX_DELAY_MS: ${PAYMENT_SIM_MAX_DELAY_MS:-200}
      PAYMENT_SIM_APPROVAL_RATE: ${PAYMENT_SIM_APPROVAL_RATE:-1.0}
      OUTBOX_PUBLISH_INTERVAL_MS: ${PAYMENT_OUTBOX_PUBLISH_INTERVAL_MS:-200}
      OUTBOX_BATCH_SIZE: ${PAYMENT_OUTBOX_BATCH_SIZE:-500}
      HIKARI_MAX_POOL_SIZE: ${PAYMENT_HIKARI_MAX_POOL_SIZE:-6}
      HIKARI_MIN_IDLE: ${PAYMENT_HIKARI_MIN_IDLE:-1}
      HIKARI_CONNECTION_TIMEOUT_MS: ${PAYMENT_HIKARI_CONNECTION_TIMEOUT_MS:-10000}
      HIKARI_IDLE_TIMEOUT_MS: ${PAYMENT_HIKARI_IDLE_TIMEOUT_MS:-60000}
      HIKARI_MAX_LIFETIME_MS: ${PAYMENT_HIKARI_MAX_LIFETIME_MS:-180000}
      SPRING_PROFILES_ACTIVE: docker
    expose:
      - "8080"
    depends_on:
      postgres-lb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-lb:
    image: haproxy:alpine
    container_name: mediqueue-payment-lb
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - ./infra/haproxy/payment/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      payment-service:
        condition: service_started
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  patient-lb:
    image: haproxy:alpine
    container_name: mediqueue-patient-lb
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./infra/haproxy/patient/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      patient-service:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  patient-service:
    build:
      context: .
      dockerfile: infra/docker/patient-service.Dockerfile
    restart: always
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=patient,public
      DB_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=patient,public
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-mediqueue}
      DB_USER: ${DB_USERNAME:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue}
      DB_PASSWORD: ${DB_PASSWORD:-mediqueue}
      HIKARI_MAX_POOL_SIZE: ${PATIENT_HIKARI_MAX_POOL_SIZE:-4}
      HIKARI_MIN_IDLE: ${PATIENT_HIKARI_MIN_IDLE:-2}
      HIKARI_CONNECTION_TIMEOUT_MS: 10000
      HIKARI_VALIDATION_TIMEOUT_MS: 3000
      HIKARI_MAX_LIFETIME_MS: 180000
      HIKARI_KEEPALIVE_TIME_MS: 30000
      HIKARI_IDLE_TIMEOUT_MS: 60000
      TOMCAT_MAX_THREADS: ${PATIENT_TOMCAT_MAX_THREADS:-100}
      TOMCAT_MIN_SPARE_THREADS: ${PATIENT_TOMCAT_MIN_SPARE_THREADS:-10}
      TOMCAT_ACCEPT_COUNT: ${PATIENT_TOMCAT_ACCEPT_COUNT:-1000}
      TOMCAT_MAX_CONNECTIONS: ${PATIENT_TOMCAT_MAX_CONNECTIONS:-4096}
      SPRING_FLYWAY_SCHEMAS: patient
      SPRING_FLYWAY_DEFAULT_SCHEMA: patient
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: patient
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-lb:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  schedule-lb:
    image: haproxy:alpine
    container_name: mediqueue-schedule-lb
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./infra/haproxy/schedule/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      schedule-service:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  schedule-service:
    build:
      context: .
      dockerfile: infra/docker/schedule-service.Dockerfile
    restart: always
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=schedule,public
      SCHEDULE_DB_URL: jdbc:postgresql://${DB_HOST:-postgres-lb}:${DB_PORT:-5432}/${DB_NAME:-mediqueue}?currentSchema=schedule,public
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-mediqueue}
      DB_USER: ${DB_USERNAME:-mediqueue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mediqueue}
      DB_PASSWORD: ${DB_PASSWORD:-mediqueue}
      HIKARI_MAX_POOL_SIZE: ${SCHEDULE_HIKARI_MAX_POOL_SIZE:-6}
      HIKARI_MIN_IDLE: ${SCHEDULE_HIKARI_MIN_IDLE:-2}
      HIKARI_CONNECTION_TIMEOUT_MS: 10000
      HIKARI_VALIDATION_TIMEOUT_MS: 3000
      HIKARI_MAX_LIFETIME_MS: 180000
      HIKARI_KEEPALIVE_TIME_MS: 30000
      HIKARI_IDLE_TIMEOUT_MS: 60000
      TOMCAT_MAX_THREADS: ${SCHEDULE_TOMCAT_MAX_THREADS:-100}
      TOMCAT_MIN_SPARE_THREADS: ${SCHEDULE_TOMCAT_MIN_SPARE_THREADS:-10}
      TOMCAT_ACCEPT_COUNT: ${SCHEDULE_TOMCAT_ACCEPT_COUNT:-1000}
      TOMCAT_MAX_CONNECTIONS: ${SCHEDULE_TOMCAT_MAX_CONNECTIONS:-4096}
      SPRING_FLYWAY_SCHEMAS: schedule
      SPRING_FLYWAY_DEFAULT_SCHEMA: schedule
      SPRING_FLYWAY_CREATE_SCHEMAS: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: schedule
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-mediqueue}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-rabbit123}
      RABBITMQ_PREFETCH: ${SCHEDULE_RABBITMQ_PREFETCH:-50}
      RABBITMQ_LISTENER_CONCURRENCY: ${SCHEDULE_RABBITMQ_LISTENER_CONCURRENCY:-4}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${SCHEDULE_RABBITMQ_LISTENER_MAX_CONCURRENCY:-12}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-lb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  k6:
    image: grafana/k6:latest
    profiles:
      - loadtest
    volumes:
      - ./infra/load-tests:/scripts
    environment:
      BASE_URL: http://api-gateway-lb:8080
      RESULTS_DIR: /scripts/results
    networks:
      - mediqueue-net
    entrypoint: ["k6"]
