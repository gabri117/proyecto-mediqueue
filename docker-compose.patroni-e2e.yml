services:
  api-gateway:
    environment:
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-false}
      GATEWAY_HTTPCLIENT_POOL_MAX_CONNECTIONS: ${GATEWAY_HTTPCLIENT_POOL_MAX_CONNECTIONS:-2000}
      GATEWAY_HTTPCLIENT_POOL_ACQUIRE_TIMEOUT_MS: ${GATEWAY_HTTPCLIENT_POOL_ACQUIRE_TIMEOUT_MS:-10000}
      GATEWAY_HTTPCLIENT_POOL_MAX_IDLE_TIME: ${GATEWAY_HTTPCLIENT_POOL_MAX_IDLE_TIME:-30s}
      GATEWAY_HTTPCLIENT_POOL_MAX_LIFE_TIME: ${GATEWAY_HTTPCLIENT_POOL_MAX_LIFE_TIME:-120s}
      GATEWAY_BULKHEAD_DEFAULT_MAX_CONCURRENT_CALLS: ${GATEWAY_BULKHEAD_DEFAULT_MAX_CONCURRENT_CALLS:-1000}
      GATEWAY_BULKHEAD_APPOINTMENT_MAX_CONCURRENT_CALLS: ${GATEWAY_BULKHEAD_APPOINTMENT_MAX_CONCURRENT_CALLS:-1200}
      GATEWAY_TIMELIMITER_TIMEOUT_SECONDS: ${GATEWAY_TIMELIMITER_TIMEOUT_SECONDS:-30}
      GATEWAY_CB_MINIMUM_CALLS: ${GATEWAY_CB_MINIMUM_CALLS:-1000}
      GATEWAY_CB_SLIDING_WINDOW_SIZE: ${GATEWAY_CB_SLIDING_WINDOW_SIZE:-5000}
      GATEWAY_CB_FAILURE_RATE_THRESHOLD: ${GATEWAY_CB_FAILURE_RATE_THRESHOLD:-95}
      GATEWAY_ACCESS_LOG_ENABLED: ${GATEWAY_ACCESS_LOG_ENABLED:-false}
      GATEWAY_SLOW_REQUEST_THRESHOLD_MS: ${GATEWAY_SLOW_REQUEST_THRESHOLD_MS:-10000}

  appointment-service:
    environment:
      HIKARI_MAX_POOL_SIZE: ${APPOINTMENT_HIKARI_MAX_POOL_SIZE:-40}
      HIKARI_MIN_IDLE: ${APPOINTMENT_HIKARI_MIN_IDLE:-10}
      HIKARI_CONNECTION_TIMEOUT_MS: ${APPOINTMENT_HIKARI_CONNECTION_TIMEOUT_MS:-10000}
      TOMCAT_MAX_THREADS: ${APPOINTMENT_TOMCAT_MAX_THREADS:-96}
      TOMCAT_MIN_SPARE_THREADS: ${APPOINTMENT_TOMCAT_MIN_SPARE_THREADS:-24}
      TOMCAT_ACCEPT_COUNT: ${APPOINTMENT_TOMCAT_ACCEPT_COUNT:-1000}
      APPOINTMENT_CREATE_MAX_CONCURRENT: ${APPOINTMENT_CREATE_MAX_CONCURRENT:-48}
      APPOINTMENT_CREATE_SLOW_THRESHOLD_MS: ${APPOINTMENT_CREATE_SLOW_THRESHOLD_MS:-3000}
      APPOINTMENT_CREATE_TIMING_LOG_ENABLED: ${APPOINTMENT_CREATE_TIMING_LOG_ENABLED:-false}
      LOADTEST_DIRECT_DB_VALIDATION_ENABLED: ${LOADTEST_DIRECT_DB_VALIDATION_ENABLED:-true}
      LOADTEST_DIRECT_VALIDATION_PRELOAD_ENABLED: ${LOADTEST_DIRECT_VALIDATION_PRELOAD_ENABLED:-true}
      LOADTEST_HOLD_EXPIRATION_ENABLED: ${LOADTEST_HOLD_EXPIRATION_ENABLED:-false}
      LOADTEST_OUTBOX_PUBLISHER_ENABLED: ${LOADTEST_OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_PUBLISH_INTERVAL_MS: ${APPOINTMENT_OUTBOX_PUBLISH_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${APPOINTMENT_OUTBOX_BATCH_SIZE:-75}
      RABBITMQ_PREFETCH: ${APPOINTMENT_RABBITMQ_PREFETCH:-5}
      RABBITMQ_LISTENER_CONCURRENCY: ${APPOINTMENT_RABBITMQ_LISTENER_CONCURRENCY:-1}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${APPOINTMENT_RABBITMQ_LISTENER_MAX_CONCURRENCY:-2}
      APPOINTMENT_PAYMENT_EVENT_PREFETCH: ${APPOINTMENT_PAYMENT_EVENT_PREFETCH:-1}
      APPOINTMENT_PAYMENT_EVENT_CONCURRENCY: ${APPOINTMENT_PAYMENT_EVENT_CONCURRENCY:-1}
      APPOINTMENT_PAYMENT_EVENT_MAX_CONCURRENCY: ${APPOINTMENT_PAYMENT_EVENT_MAX_CONCURRENCY:-1}

  payment-service:
    environment:
      HIKARI_MAX_POOL_SIZE: ${PAYMENT_HIKARI_MAX_POOL_SIZE:-12}
      HIKARI_MIN_IDLE: ${PAYMENT_HIKARI_MIN_IDLE:-3}
      HIKARI_CONNECTION_TIMEOUT_MS: ${PAYMENT_HIKARI_CONNECTION_TIMEOUT_MS:-10000}
      RABBITMQ_PREFETCH: ${PAYMENT_RABBITMQ_PREFETCH:-20}
      RABBITMQ_LISTENER_CONCURRENCY: ${PAYMENT_RABBITMQ_LISTENER_CONCURRENCY:-4}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${PAYMENT_RABBITMQ_LISTENER_MAX_CONCURRENCY:-8}
      PAYMENT_SIM_MIN_DELAY_MS: ${PAYMENT_SIM_MIN_DELAY_MS:-25}
      PAYMENT_SIM_MAX_DELAY_MS: ${PAYMENT_SIM_MAX_DELAY_MS:-100}
      PAYMENT_SIM_APPROVAL_RATE: ${PAYMENT_SIM_APPROVAL_RATE:-1.0}
      OUTBOX_PUBLISH_INTERVAL_MS: ${PAYMENT_OUTBOX_PUBLISH_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${PAYMENT_OUTBOX_BATCH_SIZE:-75}

  patient-service:
    environment:
      HIKARI_MAX_POOL_SIZE: ${PATIENT_HIKARI_MAX_POOL_SIZE:-8}
      HIKARI_MIN_IDLE: ${PATIENT_HIKARI_MIN_IDLE:-2}
      TOMCAT_MAX_THREADS: ${PATIENT_TOMCAT_MAX_THREADS:-64}
      TOMCAT_MIN_SPARE_THREADS: ${PATIENT_TOMCAT_MIN_SPARE_THREADS:-12}

  schedule-service:
    environment:
      HIKARI_MAX_POOL_SIZE: ${SCHEDULE_HIKARI_MAX_POOL_SIZE:-8}
      HIKARI_MIN_IDLE: ${SCHEDULE_HIKARI_MIN_IDLE:-2}
      TOMCAT_MAX_THREADS: ${SCHEDULE_TOMCAT_MAX_THREADS:-64}
      TOMCAT_MIN_SPARE_THREADS: ${SCHEDULE_TOMCAT_MIN_SPARE_THREADS:-12}

  notification-service:
    environment:
      HIKARI_MAX_POOL_SIZE: ${NOTIFICATION_HIKARI_MAX_POOL_SIZE:-8}
      HIKARI_MIN_IDLE: ${NOTIFICATION_HIKARI_MIN_IDLE:-2}
      RABBITMQ_LISTENER_CONCURRENCY: ${NOTIFICATION_RABBITMQ_LISTENER_CONCURRENCY:-4}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${NOTIFICATION_RABBITMQ_LISTENER_MAX_CONCURRENCY:-8}
