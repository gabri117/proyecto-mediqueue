global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend payment_frontend
    bind *:8084
    default_backend payment_backend

backend payment_backend
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template payment-service- 10 payment-service:8084 check resolvers docker resolve-prefer ipv4 init-addr libc,none
