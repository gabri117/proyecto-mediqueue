server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: payment-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/mediqueue_payment}
    username: ${DB_USER:mediqueue}
    password: ${DB_PASSWORD:mediqueue}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mediqueue}
    password: ${RABBITMQ_PASS:rabbit123}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:5}
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always

mediqueue:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  payment:
    timeout-seconds: ${PAYMENT_TIMEOUT_SECONDS:10}
    idempotency-ttl-hours: ${IDEMPOTENCY_KEY_TTL_HOURS:24}
    simulator:
      min-delay-ms: ${PAYMENT_SIM_MIN_DELAY_MS:1000}
      max-delay-ms: ${PAYMENT_SIM_MAX_DELAY_MS:8000}
      approval-rate: ${PAYMENT_SIM_APPROVAL_RATE:0.80}
  outbox:
    publish-interval-seconds: ${OUTBOX_PUBLISH_INTERVAL_SECONDS:1}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
