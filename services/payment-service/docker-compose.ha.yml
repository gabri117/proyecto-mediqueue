services:
  payment-postgres:
    image: postgres:16
    container_name: mediqueue-payment-postgres
    environment:
      POSTGRES_DB: mediqueue_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediqueue_payment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    networks:
      - mediqueue-payment-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: mediqueue-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mediqueue-payment-net

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: mediqueue-payment-service:local
    restart: unless-stopped
    expose:
      - "8084"
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://payment-postgres:5432/mediqueue_payment
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      PAYMENT_TIMEOUT_SECONDS: "10"
      IDEMPOTENCY_KEY_TTL_HOURS: "24"
      PAYMENT_SIM_MIN_DELAY_MS: "10"
      PAYMENT_SIM_MAX_DELAY_MS: "50"
      PAYMENT_SIM_APPROVAL_RATE: "1.0"
      OUTBOX_PUBLISH_INTERVAL_SECONDS: "1"
      OUTBOX_BATCH_SIZE: "100"
      HIKARI_MAX_POOL_SIZE: "20"
      HIKARI_MIN_IDLE: "5"
      RABBITMQ_PREFETCH: "10"
      RABBITMQ_LISTENER_CONCURRENCY: "2"
      RABBITMQ_LISTENER_MAX_CONCURRENCY: "5"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      INSTANCE_ID: ${HOSTNAME:-payment-service}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mediqueue-payment-net

  payment-lb:
    image: haproxy:alpine
    container_name: mediqueue-payment-lb
    depends_on:
      - payment-service
    ports:
      - "8084:8084"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - mediqueue-payment-net

volumes:
  payment-postgres-data:
  rabbitmq-data:

networks:
  mediqueue-payment-net:
    name: mediqueue-payment-net
