server.port=8081

spring.application.name=patient-service

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-lb:5432/mediqueue?currentSchema=patient,public}
spring.datasource.username=${DB_USERNAME:${DB_USER:mediqueue}}
spring.datasource.password=${DB_PASSWORD:mediqueue}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=patient
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=patient
spring.flyway.default-schema=patient
spring.flyway.create-schemas=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
