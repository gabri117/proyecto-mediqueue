services:
  postgres-appointment:
    image: postgres:16-alpine
    container_name: mediqueue-postgres-appointment
    environment:
      POSTGRES_DB: mediqueue_appointment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_appointment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediqueue_appointment"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mediqueue-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  appointment-service:
    build: .
    container_name: mediqueue-appointment-service
    ports:
      - "8083:8083"
    environment:
      # PostgreSQL Configuration
      DB_URL: jdbc:postgresql://postgres-appointment:5432/mediqueue_appointment
      DB_USER: postgres
      DB_PASSWORD: postgres

      # RabbitMQ Configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      # Redis Configuration (Autoconfig is excluded in properties, so localhost is safe)
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      # Business & Scheduled Job Configurations
      APPOINTMENT_HOLD_TTL_MINUTES: 5
      HOLD_EXPIRATION_SCAN_SECONDS: 30
      OUTBOX_PUBLISH_INTERVAL_SECONDS: 1
      OUTBOX_RETRY_INTERVAL_SECONDS: 30
      IDEMPOTENCY_CLEANUP_INTERVAL_SECONDS: 3600
      OUTBOX_CLEANUP_INTERVAL_SECONDS: 86400
    depends_on:
      postgres-appointment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_appointment_data:

networks:
  default:
    name: mediqueue-network
