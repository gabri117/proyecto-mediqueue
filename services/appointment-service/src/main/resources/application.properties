server.port=8083
spring.application.name=mediqueue-appointment-service

# =============================================================================
# Database Configuration (PostgreSQL via Flyway & JPA)
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =============================================================================
# Messaging Configuration (RabbitMQ)
# =============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# =============================================================================
# Cache Configuration (Redis)
# =============================================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# =============================================================================
# Business & Scheduled Job Configurations
# =============================================================================
mediqueue.hold.ttl-minutes=${APPOINTMENT_HOLD_TTL_MINUTES:5}
mediqueue.hold.expiration-scan-seconds=${HOLD_EXPIRATION_SCAN_SECONDS:30}
mediqueue.outbox.publish-interval-seconds=${OUTBOX_PUBLISH_INTERVAL_SECONDS:1}

# =============================================================================
# Auto-configuration Exclusions
# =============================================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
