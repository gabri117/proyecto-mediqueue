server.port=8083
spring.application.name=mediqueue-appointment-service

# =============================================================================
# Database Configuration (PostgreSQL via Flyway & JPA)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-lb:5432/mediqueue?currentSchema=appointment,public}
spring.datasource.username=${DB_USERNAME:${DB_USER:mediqueue}}
spring.datasource.password=${DB_PASSWORD:mediqueue}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=appointment
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.schemas=appointment
spring.flyway.default-schema=appointment
spring.flyway.create-schemas=false

# =============================================================================
# Messaging Configuration (RabbitMQ)
# =============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# =============================================================================
# Cache Configuration (Redis)
# =============================================================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis123}
spring.data.redis.connect-timeout=2000
spring.data.redis.timeout=1000
spring.cache.type=redis
management.health.redis.enabled=false

# =============================================================================
# Business & Scheduled Job Configurations
# =============================================================================
mediqueue.hold.ttl-minutes=${APPOINTMENT_HOLD_TTL_MINUTES:5}
mediqueue.hold.expiration-scan-seconds=${HOLD_EXPIRATION_SCAN_SECONDS:30}
mediqueue.outbox.publish-interval-seconds=${OUTBOX_PUBLISH_INTERVAL_SECONDS:1}

# =============================================================================
# External Service Client URLs
# =============================================================================
mediqueue.client.patient-service.url=${PATIENT_SERVICE_URL:http://localhost:8081}
mediqueue.client.schedule-service.url=${SCHEDULE_SERVICE_URL:http://localhost:8082}

# =============================================================================
# Resilience4j Circuit Breaker Configuration
# =============================================================================
resilience4j.circuitbreaker.instances.patient-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.patient-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.patient-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.patient-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.patient-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.patient-service.register-health-indicator=true

resilience4j.circuitbreaker.instances.schedule-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.schedule-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.schedule-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.schedule-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.schedule-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.schedule-service.register-health-indicator=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
