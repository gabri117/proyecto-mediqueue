server.port=8083
spring.application.name=mediqueue-appointment-service

# =============================================================================
# Database Configuration (PostgreSQL via Flyway & JPA)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-lb:5432/mediqueue?currentSchema=appointment,public}
spring.datasource.username=${DB_USERNAME:${DB_USER:mediqueue}}
spring.datasource.password=${DB_PASSWORD:mediqueue}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:180000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:60000}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=appointment
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.schemas=appointment
spring.flyway.default-schema=appointment
spring.flyway.create-schemas=false

# =============================================================================
# Messaging Configuration (RabbitMQ)
# =============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:25}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_LISTENER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}

# =============================================================================
# Cache Configuration (Redis)
# =============================================================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis123}
spring.data.redis.connect-timeout=2000
spring.data.redis.timeout=1000
spring.cache.type=redis
management.health.redis.enabled=false

# Redis repositories are not used in appointment-service; Redis is only used as
# Spring Cache storage. Keep RedisAutoConfiguration enabled for cache support.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# =============================================================================
# Business & Scheduled Job Configurations
# =============================================================================
mediqueue.hold.ttl-minutes=${APPOINTMENT_HOLD_TTL_MINUTES:5}
mediqueue.hold.expiration-scan-seconds=${HOLD_EXPIRATION_SCAN_SECONDS:30}
mediqueue.hold.expiration-max-per-scan=${HOLD_EXPIRATION_MAX_PER_SCAN:1000}
mediqueue.outbox.publish-interval-seconds=${OUTBOX_PUBLISH_INTERVAL_SECONDS:1}
mediqueue.outbox.publish-interval-ms=${OUTBOX_PUBLISH_INTERVAL_MS:1000}
mediqueue.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
mediqueue.loadtest.hold-expiration-enabled=${LOADTEST_HOLD_EXPIRATION_ENABLED:true}
mediqueue.loadtest.outbox-publisher-enabled=${LOADTEST_OUTBOX_PUBLISHER_ENABLED:true}
mediqueue.loadtest.direct-db-validation-enabled=${LOADTEST_DIRECT_DB_VALIDATION_ENABLED:false}

# =============================================================================
# Embedded Tomcat tuning
# =============================================================================
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}

# =============================================================================
# External Service Client URLs
# =============================================================================
mediqueue.client.patient-service.url=${PATIENT_SERVICE_URL:http://localhost:8081}
mediqueue.client.schedule-service.url=${SCHEDULE_SERVICE_URL:http://localhost:8082}
mediqueue.client.connect-timeout-ms=${APPOINTMENT_CLIENT_CONNECT_TIMEOUT_MS:1000}
mediqueue.client.read-timeout-ms=${APPOINTMENT_CLIENT_READ_TIMEOUT_MS:3000}

# =============================================================================
# Resilience4j Circuit Breaker Configuration
# =============================================================================
resilience4j.circuitbreaker.instances.patient-service.sliding-window-size=${APPOINTMENT_CLIENT_CB_SLIDING_WINDOW_SIZE:100}
resilience4j.circuitbreaker.instances.patient-service.failure-rate-threshold=${APPOINTMENT_CLIENT_CB_FAILURE_RATE_THRESHOLD:80}
resilience4j.circuitbreaker.instances.patient-service.wait-duration-in-open-state=${APPOINTMENT_CLIENT_CB_WAIT_OPEN:5s}
resilience4j.circuitbreaker.instances.patient-service.permitted-number-of-calls-in-half-open-state=${APPOINTMENT_CLIENT_CB_HALF_OPEN_CALLS:10}
resilience4j.circuitbreaker.instances.patient-service.minimum-number-of-calls=${APPOINTMENT_CLIENT_CB_MINIMUM_CALLS:50}
resilience4j.circuitbreaker.instances.patient-service.register-health-indicator=true

resilience4j.circuitbreaker.instances.schedule-service.sliding-window-size=${APPOINTMENT_CLIENT_CB_SLIDING_WINDOW_SIZE:100}
resilience4j.circuitbreaker.instances.schedule-service.failure-rate-threshold=${APPOINTMENT_CLIENT_CB_FAILURE_RATE_THRESHOLD:80}
resilience4j.circuitbreaker.instances.schedule-service.wait-duration-in-open-state=${APPOINTMENT_CLIENT_CB_WAIT_OPEN:5s}
resilience4j.circuitbreaker.instances.schedule-service.permitted-number-of-calls-in-half-open-state=${APPOINTMENT_CLIENT_CB_HALF_OPEN_CALLS:10}
resilience4j.circuitbreaker.instances.schedule-service.minimum-number-of-calls=${APPOINTMENT_CLIENT_CB_MINIMUM_CALLS:50}
resilience4j.circuitbreaker.instances.schedule-service.register-health-indicator=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# =============================================================================
# Logging Noise Control
# =============================================================================
logging.level.io.lettuce.core.protocol.ConnectionWatchdog=ERROR
logging.level.io.lettuce.core.RedisChannelHandler=ERROR
logging.level.io.netty.resolver=ERROR
