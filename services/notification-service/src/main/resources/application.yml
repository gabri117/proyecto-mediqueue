server:
  port: 8080

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediqueue_notifications}
    username: ${DB_USER:mediqueue}
    password: ${DB_PASSWORD:mediqueue}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:mediqueue}
    password: ${RABBITMQ_PASS:rabbit123}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false

notification:
  rabbitmq:
    appointments-exchange: ${NOTIFICATION_APPOINTMENTS_EXCHANGE:appointments-exchange}
    payments-exchange: ${NOTIFICATION_PAYMENTS_EXCHANGE:payments-exchange}
    appointment-queue: ${NOTIFICATION_APPOINTMENT_QUEUE:notification.appointment.queue}
    payment-queue: ${NOTIFICATION_PAYMENT_QUEUE:notification.payment.queue}
    appointment-routing-keys: ${NOTIFICATION_APPOINTMENT_ROUTING_KEYS:appointment.confirmed,appointment.cancelled,appointment.expired}
    payment-routing-keys: ${NOTIFICATION_PAYMENT_ROUTING_KEYS:payment.succeeded,payment.failed}
    dead-letter-exchange: ${NOTIFICATION_DLX:notifications.dlx}
    appointment-dead-letter-routing-key: ${NOTIFICATION_APPOINTMENT_DLQ_ROUTING_KEY:notification.appointment.dlq}
    payment-dead-letter-routing-key: ${NOTIFICATION_PAYMENT_DLQ_ROUTING_KEY:notification.payment.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      notification-sender:
        max-attempts: 1
        wait-duration: 0

logging:
  level:
    com.mediqueue.notification: INFO
    org.springframework.amqp: WARN

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/mediqueue_notifications
    username: ${DB_USER:mediqueue}
    password: ${DB_PASSWORD:mediqueue}

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:mediqueue}
    password: ${RABBITMQ_PASS:rabbit123}
