server:
  port: 8080

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-lb:5432/mediqueue?currentSchema=notification,public}
    username: ${DB_USERNAME:${DB_USER:mediqueue}}
    password: ${DB_PASSWORD:mediqueue}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: notification

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    validate-on-migrate: true
    schemas: notification
    default-schema: notification
    create-schemas: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}
        retry:
          enabled: false

notification:
  rabbitmq:
    appointments-exchange: ${NOTIFICATION_APPOINTMENTS_EXCHANGE:appointments-exchange}
    payments-exchange: ${NOTIFICATION_PAYMENTS_EXCHANGE:payments-exchange}
    appointment-queue: ${NOTIFICATION_APPOINTMENT_QUEUE:notification.appointment.queue}
    payment-queue: ${NOTIFICATION_PAYMENT_QUEUE:notification.payment.queue}
    appointment-routing-keys: ${NOTIFICATION_APPOINTMENT_ROUTING_KEYS:appointment.confirmed,appointment.cancelled,appointment.expired}
    payment-routing-keys: ${NOTIFICATION_PAYMENT_ROUTING_KEYS:payment.succeeded,payment.failed}
    dead-letter-exchange: ${NOTIFICATION_DLX:notifications.dlx}
    appointment-dead-letter-routing-key: ${NOTIFICATION_APPOINTMENT_DLQ_ROUTING_KEY:notification.appointment.dlq}
    payment-dead-letter-routing-key: ${NOTIFICATION_PAYMENT_DLQ_ROUTING_KEY:notification.payment.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      notification-sender:
        max-attempts: 1
        wait-duration: 0

logging:
  level:
    com.mediqueue.notification: INFO
    org.springframework.amqp: WARN

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-lb:5432/mediqueue?currentSchema=notification,public}
    username: ${DB_USERNAME:${DB_USER:mediqueue}}
    password: ${DB_PASSWORD:mediqueue}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
